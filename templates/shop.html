<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Магазин</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <a href="{{ url_for('home') }}" class="text-blue-400 underline mb-4 inline-block">&larr; На головну</a>
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Кібер-Магазин</h1>
            <a href="{{ url_for('admin_panel') }}" class="bg-purple-600 px-4 py-2 rounded hover:bg-purple-500 text-sm font-semibold">Адмін-панель</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            {% for p in products %}
                <div class="bg-gray-800 p-6 rounded-lg shadow flex flex-col justify-between border border-gray-700">
                    <div>
                        <h3 class="text-xl font-bold text-blue-400">{{ p.title }}</h3>
                        <p class="text-gray-300 mt-2">{{ p.description }}</p>
                        <p class="text-lg font-semibold text-green-400 mt-4">{{ p.price }} грн</p>
                    </div>
                    <form action="/shop/order/{{ p.id }}" method="POST" class="mt-4 pt-4 border-t border-gray-700">
                        <input type="text" name="customer_name" placeholder="Ваше ім'я для замовлення" required class="w-full p-2 mb-2 rounded bg-gray-700 border border-gray-600 text-white text-sm">
                        <button type="submit" class="w-full bg-green-600 py-2 rounded hover:bg-green-500 font-semibold text-sm">Купити</button>
                    </form>
                </div>
            {% else %}
                <p class="text-gray-400">Товарів поки немає. Додай їх через адмін-панель!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
