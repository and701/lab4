<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <a href="{{ url_for('home') }}" class="text-blue-400 underline mb-4 inline-block">&larr; На головну</a>
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Адмін-панель</h1>
            <div class="space-x-2">
                <a href="{{ url_for('shop') }}" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500 text-sm">Магазин</a>
                <a href="{{ url_for('feedback') }}" class="bg-gray-700 px-4 py-2 rounded hover:bg-gray-600 text-sm">Відгуки</a>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-3">Додати новий товар</h2>
        <form action="/shop/add_product" method="POST" class="bg-gray-800 p-6 rounded-lg mb-8 shadow border border-gray-700">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" name="title" placeholder="Назва товару" required class="p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm">
                <input type="number" step="0.01" name="price" placeholder="Ціна (грн)" required class="p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm">
                <input type="text" name="description" placeholder="Опис товару" class="p-2 rounded bg-gray-700 border border-gray-600 text-white text-sm">
            </div>
            <button type="submit" class="bg-purple-600 px-4 py-2 rounded hover:bg-purple-500 font-semibold text-sm">Додати товар</button>
        </form>

        <h2 class="text-xl font-bold mb-3">Замовлення</h2>
        <div class="bg-gray-800 rounded-lg overflow-hidden mb-8 shadow border border-gray-700">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-700 text-gray-300">
                        <th class="p-3">ID</th>
                        <th class="p-3">Клієнт</th>
                        <th class="p-3">Товар</th>
                        <th class="p-3">Ціна</th>
                        <th class="p-3">Статус</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                        <tr class="border-t border-gray-700">
                            <td class="p-3">{{ order.id }}</td>
                            <td class="p-3">{{ order.customer_name }}</td>
                            <td class="p-3">{{ order.title }}</td>
                            <td class="p-3">{{ order.price }} грн</td>
                            <td class="p-3">
                                <form action="/admin/order/status/{{ order.id }}" method="POST" class="flex gap-2 items-center">
                                    <select name="status" class="bg-gray-700 p-1 rounded text-xs border border-gray-600 text-white">
                                        <option value="Нове" {% if order.status == 'Нове' %}selected{% endif %}>Нове</option>
                                        <option value="Виконується" {% if order.status == 'Виконується' %}selected{% endif %}>Виконується</option>
                                        <option value="Виконано" {% if order.status == 'Виконано' %}selected{% endif %}>Виконано</option>
                                    </select>
                                    <button type="submit" class="bg-blue-600 px-2 py-1 text-xs rounded hover:bg-blue-500">Змінити</button>
                                </form>
                            </td>
                        </tr>
                    {% else %}
                        <tr><td colspan="5" class="p-4 text-gray-400 text-center">Замовлень поки немає</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
