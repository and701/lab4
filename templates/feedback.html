<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відгуки</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-xl mx-auto">
        <a href="{{ url_for('home') }}" class="text-blue-400 underline mb-4 inline-block">&larr; На головну</a>
        <h1 class="text-3xl font-bold mb-6">Відгуки</h1>
        
        <form action="/feedback" method="POST" class="bg-gray-800 p-6 rounded-lg mb-8 shadow">
            <div class="mb-4">
                <label class="block mb-2">Ваше ім'я:</label>
                <input type="text" name="name" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <div class="mb-4">
                <label class="block mb-2">Повідомлення:</label>
                <textarea name="message" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white"></textarea>
            </div>
            <button type="submit" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500 font-semibold">Надіслати відгук</button>
        </form>

        <h2 class="text-2xl font-bold mb-4">Всі відгуки:</h2>
        <div class="space-y-4">
            {% for fb in feedbacks %}
                <div class="bg-gray-800 p-4 rounded-lg shadow flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-blue-400">{{ fb.name }}</h3>
                        <p class="text-gray-300 mt-1">{{ fb.message }}</p>
                        <span class="text-xs text-gray-500 mt-2 block">{{ fb.created_at }}</span>
                    </div>
                    <form action="/admin/feedback/delete/{{ fb.id }}" method="POST">
                        <button type="submit" class="text-red-400 hover:text-red-300 text-sm">Видалити</button>
                    </form>
                </div>
            {% else %}
                <p class="text-gray-400">Поки немає відгуків. Будь першим!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
